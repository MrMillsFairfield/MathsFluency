<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Facts Speed Test</title>
<style>
  :root {
    --bg-color: #f8fafc;
    --card-bg: #ffffff;
    --text-primary: #0f172a;
    --text-secondary: #64748b;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --border: #e2e8f0;

    /* Color-Coded Operation Palette */
    --color-add: #16a34a;
    --bg-add-light: #f0fdf4;
    --border-add: #bbf7d0;

    --color-sub: #2563eb;
    --bg-sub-light: #eff6ff;
    --border-sub: #bfdbfe;

    --color-mul: #d97706;
    --bg-mul-light: #fffbeb;
    --border-mul: #fde68a;

    --color-div: #9333ea;
    --bg-div-light: #faf5ff;
    --border-div: #e9d5ff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

  body {
    background-color: var(--bg-color);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px 10px;
  }

  header {
    position: sticky;
    top: 0;
    background: var(--card-bg);
    width: 100%;
    max-width: 600px;
    padding: 16px 24px;
    border-radius: 12px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
    margin-bottom: 14px;
    border: 1px solid var(--border);
  }

  .stat-box { display: flex; flex-direction: column; align-items: center; }
  .stat-label { font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; }
  .stat-value { font-size: 1.5rem; font-weight: 700; color: var(--text-primary); }
  .timer-warning { color: #dc2626; animation: pulse 1s infinite; }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

  .start-btn, .action-btn {
    background-color: var(--accent);
    color: white;
    border: none;
    padding: 10px 20px;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .start-btn:hover, .action-btn:hover { background-color: var(--accent-hover); }

  /* Setup Panel */
  .setup-panel {
    width: 100%;
    max-width: 600px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: opacity 0.2s ease;
  }

  .setup-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .setup-title {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .shuffle-btn {
    background: #f1f5f9;
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 4px 10px;
    font-size: 0.8rem;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .shuffle-btn:hover { background: #e2e8f0; }

  /* Draggable Chips Container */
  .order-chips {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  .op-chip {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px 0;
    border-radius: 10px;
    border: 2px solid var(--border);
    cursor: grab;
    user-select: none;
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    background-color: white;
  }

  .op-chip:active { cursor: grabbing; }

  .op-chip.dragging {
    opacity: 0.3;
    transform: scale(0.95);
  }

  .op-chip.drag-over {
    border-style: dashed;
    transform: scale(1.03);
  }

  .op-badge {
    font-size: 0.65rem;
    font-weight: 800;
    opacity: 0.75;
    margin-bottom: 2px;
  }

  .op-symbol {
    font-size: 1.8rem;
    font-weight: 800;
    line-height: 1;
  }

  /* Color Styling for Draggable Chips */
  .op-chip[data-type="add"] { color: var(--color-add); border-color: var(--border-add); background-color: var(--bg-add-light); }
  .op-chip[data-type="sub"] { color: var(--color-sub); border-color: var(--border-sub); background-color: var(--bg-sub-light); }
  .op-chip[data-type="mul"] { color: var(--color-mul); border-color: var(--border-mul); background-color: var(--bg-mul-light); }
  .op-chip[data-type="div"] { color: var(--color-div); border-color: var(--border-div); background-color: var(--bg-div-light); }

  /* 5-Question Window Viewport */
  #question-list {
    width: 100%;
    max-width: 600px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    height: 348px; /* Exactly 5 items (60px each) + 4 gaps (12px each) */
    overflow: hidden;
    scroll-behavior: smooth;
    padding-right: 4px;
  }

  .q-row {
    background: var(--card-bg);
    height: 60px;
    padding: 0 20px;
    border-radius: 10px;
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: all 0.15s ease;
    flex-shrink: 0;
    border-left-width: 8px;
  }

  /* Color-coded Question Cards */
  .q-row.op-add { border-left-color: var(--color-add); }
  .q-row.op-add .q-text { color: var(--color-add); }
  .q-row.op-add.active { background-color: var(--bg-add-light); border-color: var(--color-add); }

  .q-row.op-sub { border-left-color: var(--color-sub); }
  .q-row.op-sub .q-text { color: var(--color-sub); }
  .q-row.op-sub.active { background-color: var(--bg-sub-light); border-color: var(--color-sub); }

  .q-row.op-mul { border-left-color: var(--color-mul); }
  .q-row.op-mul .q-text { color: var(--color-mul); }
  .q-row.op-mul.active { background-color: var(--bg-mul-light); border-color: var(--color-mul); }

  .q-row.op-div { border-left-color: var(--color-div); }
  .q-row.op-div .q-text { color: var(--color-div); }
  .q-row.op-div.active { background-color: var(--bg-div-light); border-color: var(--color-div); }

  .q-num { font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); width: 40px; }
  .q-text { font-size: 1.3rem; font-weight: 800; min-width: 150px; text-align: right; margin-right: 15px; }

  .q-input {
    width: 110px;
    font-size: 1.3rem;
    font-weight: 700;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    text-align: center;
    outline: none;
    background: white;
  }

  .q-input:focus { border-color: var(--accent); }

  .disabled-panel {
    opacity: 0.5;
    pointer-events: none;
  }

  /* Summary Modal */
  #summary-modal {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(4px);
    justify-content: center;
    align-items: center;
    z-index: 100;
    padding: 20px;
  }

  .summary-card {
    background: white;
    width: 100%;
    max-width: 520px;
    max-height: 90vh;
    overflow-y: auto;
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
  }

  .summary-card h2 { margin-bottom: 20px; font-size: 1.5rem; text-align: center; }
  
  .metrics-grid { 
    display: grid; 
    grid-template-columns: repeat(3, 1fr); 
    gap: 12px; 
    margin-bottom: 16px; 
  }
  
  .metric-card { background: #f8fafc; padding: 14px 10px; border-radius: 10px; text-align: center; }
  .metric-value { font-size: 1.4rem; font-weight: 800; color: var(--accent); }
  .metric-title { font-size: 0.7rem; color: var(--text-secondary); margin-top: 4px; text-transform: uppercase; font-weight: 600; }

  .recommendation-box {
    background: #fef3c7;
    border: 1px solid #fde047;
    color: #854d0e;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 0.95rem;
    line-height: 1.4;
    margin-bottom: 20px;
  }

  .incorrect-section { margin-bottom: 20px; }
  .incorrect-title { font-size: 0.85rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 10px; }

  .incorrect-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 180px;
    overflow-y: auto;
    padding-right: 4px;
  }

  .error-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fef2f2;
    border: 1px solid #fecaca;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 0.95rem;
  }

  .error-q { font-weight: 600; color: #991b1b; }
  .error-user { color: #dc2626; text-decoration: line-through; margin-right: 6px; font-weight: 600; }
  .error-correct { color: #166534; font-weight: 700; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <div class="stat-box">
    <span class="stat-label">Time Remaining</span>
    <span class="stat-value" id="timer-display">03:00</span>
  </div>
  <div class="stat-box">
    <span class="stat-label">Progress</span>
    <span class="stat-value" id="progress-display">0 / 100</span>
  </div>
  <button id="start-btn" class="start-btn" onclick="startTest()">Start Test</button>
</header>

<div class="setup-panel" id="setup-panel">
  <div class="setup-header">
    <span class="setup-title" id="setup-title">Drag to set order</span>
    <button class="shuffle-btn" onclick="randomizeOrderUI()">🔀 Randomize All</button>
  </div>
  <div class="order-chips" id="order-chips"></div>
</div>

<div id="question-list"></div>

<div id="summary-modal">
  <div class="summary-card">
    <h2>Test Results</h2>
    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-value" id="score-val">0/0</div>
        <div class="metric-title">Correct / Answered</div>
      </div>
      <div class="metric-card">
        <div class="metric-value" id="unanswered-val">0</div>
        <div class="metric-title">Unanswered</div>
      </div>
      <div class="metric-card">
        <div class="metric-value" id="ppm-val">0</div>
        <div class="metric-title">Problems / Min</div>
      </div>
    </div>

    <div class="recommendation-box" id="rec-val"></div>

    <div class="incorrect-section">
      <div class="incorrect-title">Incorrect Answers</div>
      <div id="incorrect-list" class="incorrect-list"></div>
    </div>

    <button class="action-btn" style="width: 100%;" onclick="resetTest()">Try Again</button>
  </div>
</div>

<script>
  let questions = [];
  let userAnswers = {};
  let timerInterval = null;
  let timeLeft = 180;
  let isRunning = false;
  let activeQId = null;
  let isFullyRandomized = false;

  const opSymbols = {
    add: '+',
    sub: '−',
    mul: '×',
    div: '÷'
  };

  const opNames = {
    add: 'Addition',
    sub: 'Subtraction',
    mul: 'Multiplication',
    div: 'Division'
  };

  let currentOrder = ['add', 'sub', 'mul', 'div'];
  let draggedIndex = null;

  // Difficulty levels tracking
  let diffLevels = { add: 1, sub: 1, mul: 3, div: 3 };

  function randomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
  }

  /* Draggable UI Order Controls */
  function renderOrderChips() {
    const container = document.getElementById('order-chips');
    const titleEl = document.getElementById('setup-title');
    container.innerHTML = '';

    if (isFullyRandomized) {
      titleEl.textContent = 'Order: Fully Mixed';
    } else {
      titleEl.textContent = 'Drag to set order';
    }

    currentOrder.forEach((type, index) => {
      const chip = document.createElement('div');
      chip.className = 'op-chip';
      chip.setAttribute('draggable', 'true');
      chip.setAttribute('data-type', type);
      chip.dataset.index = index;

      chip.innerHTML = `
        <span class="op-badge">${isFullyRandomized ? 'MIXED' : 'STEP ' + (index + 1)}</span>
        <span class="op-symbol">${opSymbols[type]}</span>
      `;

      chip.addEventListener('dragstart', handleDragStart);
      chip.addEventListener('dragover', handleDragOver);
      chip.addEventListener('dragenter', handleDragEnter);
      chip.addEventListener('dragleave', handleDragLeave);
      chip.addEventListener('drop', handleDrop);
      chip.addEventListener('dragend', handleDragEnd);

      container.appendChild(chip);
    });
  }

  function handleDragStart(e) {
    draggedIndex = parseInt(this.dataset.index, 10);
    this.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  }

  function handleDragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
  }

  function handleDragEnter(e) {
    e.preventDefault();
    this.classList.add('drag-over');
  }

  function handleDragLeave() {
    this.classList.remove('drag-over');
  }

  function handleDrop(e) {
    e.preventDefault();
    this.classList.remove('drag-over');
    const targetIndex = parseInt(this.dataset.index, 10);

    if (draggedIndex !== null && draggedIndex !== targetIndex) {
      isFullyRandomized = false; // Switch back to ordered blocks when dragging manually
      const movedItem = currentOrder.splice(draggedIndex, 1)[0];
      currentOrder.splice(targetIndex, 0, movedItem);

      renderOrderChips();
      createQuestionSet();
      renderQuestions();
    }
  }

  function handleDragEnd() {
    this.classList.remove('dragging');
    document.querySelectorAll('.op-chip').forEach(c => c.classList.remove('drag-over'));
    draggedIndex = null;
  }

  function randomizeOrderUI() {
    isFullyRandomized = true;
    currentOrder.sort(() => Math.random() - 0.5);
    renderOrderChips();
    createQuestionSet();
    renderQuestions();
  }

  function generateFact(type) {
    let level = diffLevels[type];
    let num1, num2, answer, text, subType;

    if (type === 'add') {
      num2 = randomInt(1, 9); // Always adding a 1-digit number
      if (level === 1) {
        num1 = randomInt(10, 99); // 2-digit number
      } else if (level === 2) {
        num1 = randomInt(100, 499); // 3-digit number (lower range)
      } else if (level === 3) {
        num1 = randomInt(500, 999); // 3-digit number (higher range)
      } else {
        num1 = randomInt(100, 999); // 3-digit number (full range)
      }
      answer = num1 + num2;
      text = `${num1} + ${num2}`;
      subType = `Adding +${num2}`;
    } 
    else if (type === 'sub') {
      num2 = randomInt(1, 9); // Always subtracting a 1-digit number
      if (level === 1) {
        answer = randomInt(10, 90); // Creates a 2-digit base
      } else if (level === 2) {
        answer = randomInt(100, 490); // Creates a 3-digit base
      } else if (level === 3) {
        answer = randomInt(500, 990); // Creates a 3-digit base (higher range)
      } else {
        answer = randomInt(100, 990); // Creates a 3-digit base (full range)
      }
      num1 = answer + num2;
      text = `${num1} − ${num2}`;
      subType = `Subtracting −${num2}`;
    } 
    else if (type === 'mul') {
      let easyPool = [2, 5, 10];               // Level 1: Only if struggling
      let medPool = [3, 4, 6];                // Level 2: Medium pool
      let hardPool = [7, 8, 9, 11, 12];       // Level 3: Hard pool (default start)
      
      if (level === 1) {
        num2 = easyPool[randomInt(0, easyPool.length - 1)];
        num1 = randomInt(2, 10);
      } else if (level === 2) {
        num2 = medPool[randomInt(0, medPool.length - 1)];
        num1 = randomInt(2, 12);
      } else if (level === 3) {
        num2 = hardPool[randomInt(0, hardPool.length - 1)];
        num1 = randomInt(3, 12);
      } else {
        num1 = randomInt(6, 12);
        num2 = randomInt(6, 12);
      }

      answer = num1 * num2;
      text = `${num1} × ${num2}`;
      subType = `${num2}× Tables`;
    } 
    else if (type === 'div') {
      let easyPool = [2, 5, 10];               // Level 1: Only if struggling
      let medPool = [3, 4, 6];                // Level 2: Medium pool
      let hardPool = [7, 8, 9, 11, 12];       // Level 3: Hard pool (default start)

      if (level === 1) {
        num2 = easyPool[randomInt(0, easyPool.length - 1)];
        answer = randomInt(2, 10);
      } else if (level === 2) {
        num2 = medPool[randomInt(0, medPool.length - 1)];
        answer = randomInt(2, 12);
      } else if (level === 3) {
        num2 = hardPool[randomInt(0, hardPool.length - 1)];
        answer = randomInt(3, 12);
      } else {
        num2 = randomInt(6, 12);
        answer = randomInt(6, 12);
      }

      num1 = answer * num2;
      text = `${num1} ÷ ${num2}`;
      subType = `Dividing by ${num2}`;
    }

    return { id: Math.random().toString(36).substr(2, 9), type, text, answer, subType };
  }

  function createQuestionSet() {
    questions = [];
    if (isFullyRandomized) {
      // Generate 25 of each operation and shuffle all 100 together
      ['add', 'sub', 'mul', 'div'].forEach(type => {
        for (let i = 0; i < 25; i++) {
          questions.push(generateFact(type));
        }
      });
      shuffleArray(questions);
    } else {
      // Group in blocks of 25 according to currentOrder
      currentOrder.forEach(type => {
        for (let i = 0; i < 25; i++) {
          questions.push(generateFact(type));
        }
      });
    }
  }

  function renderQuestions() {
    const container = document.getElementById('question-list');
    container.innerHTML = '';

    questions.forEach((q, index) => {
      const row = document.createElement('div');
      row.className = `q-row op-${q.type}`;
      row.id = `row-${index}`;
      row.dataset.id = q.id;
      
      row.innerHTML = `
        <span class="q-num">#${index + 1}</span>
        <span class="q-text" id="text-${index}">${q.text} =</span>
        <input type="number" 
               class="q-input" 
               id="input-${index}" 
               value="${userAnswers[q.id] || ''}" 
               ${isRunning ? '' : 'disabled'} 
               oninput="onAnswerInput(${index})" 
               onkeydown="handleKeyDown(event, ${index})">
      `;

      row.addEventListener('click', () => {
        if (isRunning) focusInput(index);
      });

      container.appendChild(row);
    });
  }

  function startTest() {
    if (isRunning) return;
    isRunning = true;
    
    document.getElementById('start-btn').classList.add('hidden');
    document.getElementById('setup-panel').classList.add('disabled-panel');
    
    document.querySelectorAll('.q-input').forEach(input => input.disabled = false);

    timerInterval = setInterval(() => {
      timeLeft--;
      updateTimerDisplay();
      if (timeLeft <= 0) finishTest();
    }, 1000);

    focusInput(0);
  }

  function updateTimerDisplay() {
    const mins = Math.floor(timeLeft / 60);
    const secs = timeLeft % 60;
    const display = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    const el = document.getElementById('timer-display');
    el.textContent = display;
    if (timeLeft <= 30) el.classList.add('timer-warning');
  }

  function focusInput(index) {
    if (index < 0 || index >= questions.length) return;
    activeQId = questions[index].id;

    document.querySelectorAll('.q-row').forEach(r => r.classList.remove('active'));
    
    const container = document.getElementById('question-list');
    const targetRow = document.getElementById(`row-${index}`);
    const targetInput = document.getElementById(`input-${index}`);

    if (targetRow && targetInput) {
      targetRow.classList.add('active');
      targetInput.focus();
      targetInput.select();
      
      // Frame active question at top of 5-item viewport
      container.scrollTo({
        top: targetRow.offsetTop - container.offsetTop,
        behavior: 'smooth'
      });
    }
  }

  function onAnswerInput(index) {
    const q = questions[index];
    const val = document.getElementById(`input-${index}`).value.trim();
    userAnswers[q.id] = val;

    if (val !== '') {
      const isCorrect = parseInt(val, 10) === q.answer;
      let levelChanged = false;

      if (isCorrect && diffLevels[q.type] < 4) {
        diffLevels[q.type]++;
        levelChanged = true;
      } else if (!isCorrect && diffLevels[q.type] > 1) {
        diffLevels[q.type]--;
        levelChanged = true;
      }

      if (levelChanged) {
        updateUpcomingQuestions(q.type, index);
      }
    }

    updateProgress();

    if (Object.keys(userAnswers).filter(k => userAnswers[k] !== '').length === 100) {
      finishTest();
    }
  }

  function updateUpcomingQuestions(type, currentIndex) {
    const bufferStartIndex = currentIndex + 5;

    for (let i = bufferStartIndex; i < questions.length; i++) {
      const futureQ = questions[i];
      if (futureQ.type === type && (!userAnswers[futureQ.id] || userAnswers[futureQ.id].trim() === '')) {
        const newFact = generateFact(type);
        newFact.id = futureQ.id;
        questions[i] = newFact;

        const textElem = document.getElementById(`text-${i}`);
        if (textElem) {
          textElem.textContent = `${newFact.text} =`;
        }
      }
    }
  }

  function updateProgress() {
    const answeredCount = Object.keys(userAnswers).filter(k => userAnswers[k] !== '').length;
    document.getElementById('progress-display').textContent = `${answeredCount} / 100`;
  }

  function handleKeyDown(e, index) {
    if (e.key === 'Enter' || e.key === 'ArrowDown') {
      e.preventDefault();
      focusInput(index + 1);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      focusInput(index - 1);
    }
  }

  function finishTest() {
    clearInterval(timerInterval);
    isRunning = false;

    const timeSpentSeconds = Math.max(1, 180 - timeLeft);
    let totalAnswered = 0;
    let totalCorrect = 0;
    let categoryErrors = { add: 0, sub: 0, mul: 0, div: 0 };
    let subTypeErrors = {};
    let incorrectQuestions = [];

    questions.forEach(q => {
      const uAns = userAnswers[q.id];
      const isAnswered = uAns !== undefined && uAns.trim() !== '';

      if (isAnswered) {
        totalAnswered++;
        const correct = parseInt(uAns, 10) === q.answer;
        if (correct) {
          totalCorrect++;
        } else {
          categoryErrors[q.type]++;
          subTypeErrors[q.subType] = (subTypeErrors[q.subType] || 0) + 1;
          incorrectQuestions.push({ text: q.text, userAns: uAns, correctAns: q.answer });
        }
      } else {
        categoryErrors[q.type]++;
        subTypeErrors[q.subType] = (subTypeErrors[q.subType] || 0) + 1;
      }
    });

    const totalUnanswered = 100 - totalAnswered;
    const ppm = Math.round((totalCorrect / timeSpentSeconds) * 60);

    let mainWeakType = Object.keys(categoryErrors).reduce((a, b) => categoryErrors[a] > categoryErrors[b] ? a : b);
    let specificWeakSubType = Object.keys(subTypeErrors).reduce((a, b) => (subTypeErrors[a] || 0) > (subTypeErrors[b] || 0) ? a : b, '');

    let recText = '';
    if (totalCorrect === 100) {
      recText = `🌟 <strong>Perfect score!</strong> Fantastic speed and accuracy across all basic facts.`;
    } else if (specificWeakSubType && subTypeErrors[specificWeakSubType] > 1) {
      recText = `<strong>Target Practice:</strong> Focus primarily on <strong>${opNames[mainWeakType]} (${opSymbols[mainWeakType]})</strong>, especially <strong>${specificWeakSubType}</strong>.`;
    } else {
      recText = `<strong>Target Practice:</strong> Focus primarily on building speed in <strong>${opNames[mainWeakType]} (${opSymbols[mainWeakType]})</strong>.`;
    }

    // Update Modal Results
    document.getElementById('score-val').textContent = `${totalCorrect} / ${totalAnswered}`;
    document.getElementById('unanswered-val').textContent = totalUnanswered;
    document.getElementById('ppm-val').textContent = ppm;
    document.getElementById('rec-val').innerHTML = recText;

    // Render Incorrect Problems
    const errorContainer = document.getElementById('incorrect-list');
    errorContainer.innerHTML = '';

    if (incorrectQuestions.length === 0) {
      errorContainer.innerHTML = '<p style="color: #166534; font-size: 0.9rem; font-weight: 600; text-align: center; padding: 10px;">No incorrect answers!</p>';
    } else {
      incorrectQuestions.forEach(item => {
        const row = document.createElement('div');
        row.className = 'error-item';
        row.innerHTML = `
          <span class="error-q">${item.text} =</span>
          <div>
            <span class="error-user">${item.userAns}</span>
            <span class="error-correct">→ ${item.correctAns}</span>
          </div>
        `;
        errorContainer.appendChild(row);
      });
    }

    document.getElementById('summary-modal').style.display = 'flex';
  }

  function resetTest() {
    clearInterval(timerInterval);
    timeLeft = 180;
    isRunning = false;
    activeQId = null;
    userAnswers = {};
    diffLevels = { add: 1, sub: 1, mul: 3, div: 3 };

    document.getElementById('timer-display').textContent = '03:00';
    document.getElementById('timer-display').classList.remove('timer-warning');
    document.getElementById('progress-display').textContent = '0 / 100';
    document.getElementById('start-btn').classList.remove('hidden');
    document.getElementById('setup-panel').classList.remove('disabled-panel');
    document.getElementById('summary-modal').style.display = 'none';

    createQuestionSet();
    renderQuestions();
  }

  // Initialization
  renderOrderChips();
  createQuestionSet();
  renderQuestions();
</script>
</body>
</html>
